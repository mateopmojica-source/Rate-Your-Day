<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230A0A0D'/%3E%3Crect x='40' y='40' width='40' height='40' rx='6' fill='%2379B8E8'/%3E%3Crect x='100' y='40' width='40' height='40' rx='6' fill='%233452A8'/%3E%3Crect x='40' y='100' width='40' height='40' rx='6' fill='%23E39440'/%3E%3Crect x='100' y='100' width='40' height='40' rx='6' fill='%23CF574C'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0D">
<title>Días</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFEEE8;
    --ink:#12172B;
    --ink-soft:#6B7188;
    --line:#DBDAD2;
    --card:#F7F6F1;
    --n0:#DADEE8;
    --n1:#C1483F;
    --n2:#D9812F;
    --n3:#1F3C88;
    --n4:#79B8E8;
    --danger:#B3453B;
    --good:#3D7A5C;
    --cell-border:rgba(0,0,0,.05);
    --num-lo:rgba(0,0,0,.4);
    --num-hi:rgba(255,255,255,.8);
    --overlay:rgba(18,23,43,.42);
    --sheet-shadow:rgba(0,0,0,.15);
    --item-bg:rgba(18,23,43,.045);
  }
  html[data-theme="dark"]{
    --bg:#0A0A0D;
    --ink:#F2F1ED;
    --ink-soft:#8A8DA0;
    --line:#242530;
    --card:#151519;
    --n0:#1C1D26;
    --n1:#CF574C;
    --n2:#E39440;
    --n3:#3452A8;
    --n4:#8FCBF2;
    --danger:#E2695F;
    --good:#5FBF8F;
    --cell-border:rgba(255,255,255,.05);
    --num-lo:rgba(255,255,255,.4);
    --num-hi:rgba(255,255,255,.85);
    --overlay:rgba(0,0,0,.6);
    --sheet-shadow:rgba(0,0,0,.5);
    --item-bg:rgba(255,255,255,.05);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  html{ transition:background .2s ease; }
  body{padding-bottom:calc(48px + env(safe-area-inset-bottom));}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{
    padding:calc(18px + env(safe-area-inset-top)) 20px 16px;
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    max-width:520px; margin:0 auto; box-sizing:border-box;
  }
  .yearrow{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .yearrow .left{ display:flex; align-items:center; gap:12px; }
  .yearrow .ybtn{
    width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; color:var(--ink); cursor:pointer;
  }
  .yearrow .ybtn:active{background:var(--n0);}
  .yearrow .ylabel{
    font-size:15px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:600;
  }
  .theme-toggle{
    width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; cursor:pointer;
  }
  .theme-toggle:active{ background:var(--n0); }
  .dow-row{
    display:grid; grid-template-columns:repeat(7,1fr); gap:5px;
  }
  .dow-row span{
    text-align:center; font-size:11px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--ink-soft); font-weight:500;
  }

  main{ padding:20px 20px 0; max-width:520px; margin:0 auto; }
  .month{ margin-bottom:28px; }
  .month h2{
    font-size:13.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:600; margin:0 0 11px 2px;
  }
  .grid{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:6px;
  }
  .cell{
    aspect-ratio:1; border-radius:6px; position:relative;
    background:var(--n0); border:1px solid var(--cell-border);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .cell.empty{ visibility:hidden; }
  .cell.future{ background:transparent; border:1px dashed var(--line); cursor:default; }
  .cell .num{
    position:absolute; top:3px; left:4px;
    font-size:9px; color:var(--num-lo); font-weight:500; opacity:.7;
  }
  .cell .grade-display{
    font-size:12.5px; font-weight:700; letter-spacing:-0.02em;
    font-family:'IBM Plex Mono',monospace; color:var(--ink);
  }
  .cell.r1{ background:var(--n1); }
  .cell.r2{ background:var(--n2); }
  .cell.r3{ background:var(--n3); }
  .cell.r4{ background:var(--n4); }
  .cell.r1 .num, .cell.r1 .grade-display,
  .cell.r2 .num, .cell.r2 .grade-display,
  .cell.r3 .num, .cell.r3 .grade-display{ color:#fff; }
  .cell.r1 .num, .cell.r2 .num, .cell.r3 .num{ opacity:.75; }
  .cell.r4 .num, .cell.r4 .grade-display{ color:var(--ink); }
  .cell.today{ box-shadow:0 0 0 2px var(--ink); }
  .cell.future .num{ opacity:.4; }

  .day-screen{
    position:fixed; inset:0; background:var(--bg); z-index:20;
    display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .25s ease;
  }
  .day-screen.open{ transform:translateY(0); }
  .day-screen-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 20px 14px; border-bottom:1px solid var(--line);
    flex:0 0 auto; max-width:520px; width:100%; margin:0 auto; box-sizing:border-box;
  }
  .back-btn{
    border:none; background:none; color:var(--ink); font-size:15px;
    font-weight:600; cursor:pointer; padding:6px 4px 6px 0;
    display:flex; align-items:center; gap:4px;
  }
  .header-delete{
    border:none; background:none; color:var(--danger); font-size:14px;
    font-weight:600; cursor:pointer; padding:6px 4px;
  }
  .day-screen-body{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:20px 20px 8px; max-width:520px; width:100%; margin:0 auto; box-sizing:border-box;
  }
  .day-screen-footer{
    flex:0 0 auto; padding:14px 20px calc(20px + env(safe-area-inset-bottom)); border-top:1px solid var(--line);
    background:var(--bg); max-width:520px; width:100%; margin:0 auto; box-sizing:border-box;
  }
  .date-label{ font-size:13px; color:var(--ink-soft); margin-bottom:2px; font-weight:500;}
  .date-big{ font-size:22px; font-weight:700; letter-spacing:-0.01em; margin-bottom:18px; }
  .grade-row{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .grade-input{
    width:76px; font-size:26px; font-weight:700; letter-spacing:-0.02em;
    border:1px solid var(--line); border-radius:10px; padding:8px 6px;
    text-align:center; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
  }
  .grade-input:focus{ outline:none; border-color:var(--ink); }
  .grade-info{ display:flex; flex-direction:column; gap:2px; }
  .grade-label{ font-size:13px; font-weight:600; }
  .grade-hint{ font-size:11.5px; color:var(--ink-soft); }
  .grade-dot{
    width:16px; height:16px; border-radius:50%; margin-left:auto;
    background:var(--n0); border:1px solid var(--line); flex:0 0 auto;
    transition:background .15s ease;
  }
  .field{ margin-bottom:32px; }
  .field label{
    display:flex; align-items:center; gap:8px; font-size:16px;
    font-weight:700; margin-bottom:10px; color:var(--ink);
  }
  .field label .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .field.good-field label .dot{ background:var(--good); }
  .field.bad-field label .dot{ background:var(--danger); }
  .chevron{
    margin-left:auto; border:none; background:none; color:var(--ink-soft);
    font-size:11px; cursor:pointer; padding:6px; line-height:1;
    transform:rotate(0deg); transition:transform .15s ease;
  }
  .chevron.collapsed{ transform:rotate(-90deg); }
  .item-row{ display:flex; gap:8px; margin-bottom:8px; overflow:hidden; }
  .item-row.hidden{ display:none; }
  .item-row input{
    flex:1; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-family:'Inter',sans-serif; font-size:14px;
    color:var(--ink); background:var(--bg);
  }
  .item-row input:focus{ outline:none; border-color:var(--ink); }
  .item-add{
    width:38px; flex:0 0 auto; border:none; border-radius:10px;
    background:var(--ink); color:#fff; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  html[data-theme="dark"] .item-add{ background:var(--n3); }
  .item-edit{
    width:38px; flex:0 0 auto; border:1px solid var(--line); border-radius:10px;
    background:var(--bg); color:var(--ink-soft); font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .item-edit.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  html[data-theme="dark"] .item-edit.active{ background:var(--n3); border-color:var(--n3); }
  .item-list{ list-style:none; margin:0; padding:0; }
  .item-list:empty{ display:none; }
  .item-list li{
    display:flex; align-items:center; gap:8px;
    padding:9px 10px; font-size:14px;
    background:var(--item-bg); border-radius:8px; margin-bottom:6px;
  }
  .item-list li .txt{ flex:1; word-break:break-word; }
  .item-list li .rm{
    flex:0 0 auto; border:none; background:transparent; color:var(--ink-soft);
    font-size:16px; cursor:pointer; padding:0 2px; line-height:1;
  }
  .item-list li .rm:active{ color:var(--danger); }
  .sheet-actions{ display:flex; gap:10px; }
  .btn{
    flex:1; border:none; border-radius:10px; padding:13px; font-size:14.5px;
    font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn-primary{ background:var(--ink); color:#fff; }
  html[data-theme="dark"] .btn-primary{ background:var(--n3); color:#fff; }
  .btn-ghost{ background:var(--bg); color:var(--ink-soft); border:1px solid var(--line); }
  .btn-delete{ background:transparent; color:var(--danger); border:1px solid transparent; flex:0 0 auto; padding:13px 14px; }

  .legend{
    display:flex; align-items:center; gap:6px; margin:22px 20px 6px; max-width:520px;
    margin-left:auto; margin-right:auto; padding:0 20px;
    font-size:11px; color:var(--ink-soft);
  }
  .legend .sw{ width:11px; height:11px; border-radius:3px; }
  .loading{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px; }
</style>
</head>
<body>

<header>
  <div class="yearrow">
    <div class="left">
      <button class="ybtn" id="prevYear">‹</button>
      <div class="ylabel mono" id="yearLabel">2026</div>
      <button class="ybtn" id="nextYear">›</button>
    </div>
    <button class="theme-toggle" id="themeToggle">☀️</button>
  </div>
  <div class="dow-row">
    <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
  </div>
</header>

<main id="main"></main>

<div class="legend" id="legend" style="display:none">
  <span class="sw" style="background:var(--n1)"></span><span>1-4</span>
  <span class="sw" style="background:var(--n2)"></span><span>5-6</span>
  <span class="sw" style="background:var(--n3)"></span><span>7-8</span>
  <span class="sw" style="background:var(--n4)"></span><span>9-10</span>
</div>

<div class="day-screen" id="dayScreen">
  <div class="day-screen-header">
    <button class="back-btn" id="backBtn" type="button">‹ Volver</button>
    <button class="header-delete" id="deleteBtn" type="button">Borrar</button>
  </div>
  <div class="day-screen-body" id="dayScreenBody">
    <div class="date-label mono" id="sheetDow">MARTES</div>
    <div class="date-big" id="sheetDate">1 de enero</div>
    <div class="grade-row">
      <input type="text" inputmode="decimal" id="gradeInput" class="grade-input" placeholder="0,0" maxlength="4">
      <div class="grade-info">
        <span class="grade-label">Nota del día</span>
        <span class="grade-hint">de 0 a 10, ej. 4,5</span>
      </div>
      <div class="grade-dot" id="gradeDot"></div>
    </div>
    <div class="field good-field">
      <label>
        <span class="dot"></span>Cosas buenas
        <button class="chevron" id="goodChevron" type="button">⌄</button>
      </label>
      <div class="item-row" id="goodItemRow">
        <input type="text" id="goodItemInput" placeholder="Añade algo bueno...">
        <button class="item-add" id="goodAddBtn" type="button">+</button>
        <button class="item-edit" id="goodEditBtn" type="button">✎</button>
      </div>
      <ul class="item-list good-list" id="goodList"></ul>
    </div>
    <div class="field bad-field">
      <label>
        <span class="dot"></span>Cosas malas
        <button class="chevron" id="badChevron" type="button">⌄</button>
      </label>
      <div class="item-row" id="badItemRow">
        <input type="text" id="badItemInput" placeholder="Añade algo malo...">
        <button class="item-add" id="badAddBtn" type="button">+</button>
        <button class="item-edit" id="badEditBtn" type="button">✎</button>
      </div>
      <ul class="item-list bad-list" id="badList"></ul>
    </div>
  </div>
  <div class="day-screen-footer">
    <button class="btn btn-primary" id="saveBtn" style="width:100%">Guardar</button>
  </div>
</div>

<script>
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DOW = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

const storage = {
  async get(key){
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value };
  }
};

let currentYear = new Date().getFullYear();
let data = {}; // { "2026-01-01": {grade:4.5, good:["...","..."], bad:["...","..."]} }
let activeDate = null;
let goodItems = [];
let badItems = [];

const todayStr = fmt(new Date());

function fmt(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function gradeTier(g){
  if(g === null || g === undefined || isNaN(g)) return null;
  if(g <= 4) return 1;
  if(g <= 6) return 2;
  if(g <= 8) return 3;
  return 4;
}

function formatGrade(g){
  return Number.isInteger(g) ? String(g) : String(g).replace('.', ',');
}

function parseGradeInput(raw){
  const trimmed = (raw || '').trim();
  if(trimmed === '') return null;
  const parsed = parseFloat(trimmed.replace(',', '.'));
  if(isNaN(parsed)) return null;
  return Math.round(Math.max(0, Math.min(10, parsed)) * 10) / 10;
}

function normalizeItems(val){
  if(Array.isArray(val)) return val.filter(x=>x && x.trim()).map(x=>x.trim());
  if(typeof val === 'string' && val.trim()){
    return val.split('\n').map(x=>x.trim()).filter(Boolean);
  }
  return [];
}

async function loadYear(year){
  data = {};
  try{
    const res = await storage.get('year:'+year, false);
    if(res && res.value){ data = JSON.parse(res.value); }
  }catch(e){
    // no existing data for this year yet, that's fine
  }
  render();
}

async function persist(){
  try{
    await storage.set('year:'+currentYear, JSON.stringify(data), false);
  }catch(e){
    console.error('No se pudo guardar', e);
  }
}

function render(){
  document.getElementById('yearLabel').textContent = currentYear;
  const main = document.getElementById('main');
  main.innerHTML = '';

  for(let m=0; m<12; m++){
    const monthDiv = document.createElement('div');
    monthDiv.className = 'month';
    const h2 = document.createElement('h2');
    h2.textContent = MONTHS[m];
    monthDiv.appendChild(h2);

    const grid = document.createElement('div');
    grid.className = 'grid';

    const firstDay = new Date(currentYear, m, 1);
    const leadEmpty = (firstDay.getDay() + 6) % 7; // Monday = 0
    for(let i=0;i<leadEmpty;i++){
      const e = document.createElement('div');
      e.className = 'cell empty';
      grid.appendChild(e);
    }

    const daysInMonth = new Date(currentYear, m+1, 0).getDate();
    for(let day=1; day<=daysInMonth; day++){
      const dateObj = new Date(currentYear, m, day);
      const dStr = fmt(dateObj);
      const isFuture = dStr > todayStr;
      const cell = document.createElement('div');
      const entry = data[dStr];
      let cls = 'cell';
      if(isFuture){ cls += ' future'; }
      else{
        const tier = entry ? gradeTier(entry.grade) : null;
        if(tier){ cls += ' r'+tier; }
      }
      if(dStr === todayStr){ cls += ' today'; }
      cell.className = cls;
      const num = document.createElement('div');
      num.className = 'num mono';
      num.textContent = day;
      cell.appendChild(num);
      if(entry && entry.grade !== undefined && entry.grade !== null && !isNaN(entry.grade)){
        const gradeEl = document.createElement('div');
        gradeEl.className = 'grade-display';
        gradeEl.textContent = formatGrade(entry.grade);
        cell.appendChild(gradeEl);
      }
      if(!isFuture){
        cell.addEventListener('click', ()=> openSheet(dStr));
      }
      grid.appendChild(cell);
    }
    monthDiv.appendChild(grid);
    main.appendChild(monthDiv);
  }
  document.getElementById('legend').style.display = 'flex';
}

let editModes = { goodList:false, badList:false };

function openSheet(dStr){
  activeDate = dStr;
  const entry = data[dStr] || {};

  const [y,mo,da] = dStr.split('-').map(Number);
  const dateObj = new Date(y, mo-1, da);
  document.getElementById('sheetDow').textContent = DOW[dateObj.getDay()];
  document.getElementById('sheetDate').textContent = da+' de '+MONTHS[mo-1].toLowerCase()+ (y!==currentYear?' '+y:'');

  const gradeInput = document.getElementById('gradeInput');
  gradeInput.value = (entry.grade !== undefined && entry.grade !== null) ? String(entry.grade).replace('.', ',') : '';
  goodItems = normalizeItems(entry.good);
  badItems = normalizeItems(entry.bad);
  document.getElementById('goodItemInput').value = '';
  document.getElementById('badItemInput').value = '';
  editModes.goodList = false;
  editModes.badList = false;
  setEditButtonState('goodEditBtn', false);
  setEditButtonState('badEditBtn', false);
  renderItemList('goodList', goodItems);
  renderItemList('badList', badItems);
  updateGradeDot();

  document.getElementById('deleteBtn').style.visibility = (dStr in data) ? 'visible' : 'hidden';
  document.getElementById('dayScreenBody').scrollTop = 0;
  document.getElementById('dayScreen').classList.add('open');
}

function setEditButtonState(btnId, active){
  const btn = document.getElementById(btnId);
  btn.classList.toggle('active', active);
  btn.textContent = active ? '✓' : '✎';
}

function renderItemList(listId, items){
  const list = document.getElementById(listId);
  const editing = editModes[listId];
  list.innerHTML = '';
  items.forEach((text, idx)=>{
    const li = document.createElement('li');
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = text;
    li.appendChild(txt);
    if(editing){
      const rm = document.createElement('button');
      rm.className = 'rm';
      rm.type = 'button';
      rm.textContent = '×';
      rm.addEventListener('click', ()=>{
        items.splice(idx, 1);
        renderItemList(listId, items);
      });
      li.appendChild(rm);
    }
    list.appendChild(li);
  });
}

function addItem(inputId, listId, items){
  const input = document.getElementById(inputId);
  const val = input.value.trim();
  if(!val) return;
  items.push(val);
  input.value = '';
  renderItemList(listId, items);
  input.focus();
}

function toggleEditMode(listId, btnId){
  editModes[listId] = !editModes[listId];
  setEditButtonState(btnId, editModes[listId]);
  renderItemList(listId, listId === 'goodList' ? goodItems : badItems);
}

document.getElementById('goodEditBtn').addEventListener('click', ()=> toggleEditMode('goodList','goodEditBtn'));
document.getElementById('badEditBtn').addEventListener('click', ()=> toggleEditMode('badList','badEditBtn'));

document.getElementById('goodAddBtn').addEventListener('click', ()=> addItem('goodItemInput','goodList', goodItems));
document.getElementById('badAddBtn').addEventListener('click', ()=> addItem('badItemInput','badList', badItems));
document.getElementById('goodItemInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ e.preventDefault(); addItem('goodItemInput','goodList', goodItems); }
});
document.getElementById('badItemInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ e.preventDefault(); addItem('badItemInput','badList', badItems); }
});

function updateGradeDot(){
  const dot = document.getElementById('gradeDot');
  const grade = parseGradeInput(document.getElementById('gradeInput').value);
  const tier = gradeTier(grade);
  dot.style.background = tier ? 'var(--n'+tier+')' : 'var(--n0)';
}

document.getElementById('gradeInput').addEventListener('input', updateGradeDot);

function toggleChevron(chevronId, rowId){
  const chevron = document.getElementById(chevronId);
  const row = document.getElementById(rowId);
  const collapsed = row.classList.toggle('hidden');
  chevron.classList.toggle('collapsed', collapsed);
}
document.getElementById('goodChevron').addEventListener('click', ()=> toggleChevron('goodChevron','goodItemRow'));
document.getElementById('badChevron').addEventListener('click', ()=> toggleChevron('badChevron','badItemRow'));

function closeSheet(){
  document.getElementById('dayScreen').classList.remove('open');
  activeDate = null;
}

document.getElementById('backBtn').addEventListener('click', closeSheet);

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  if(!activeDate) { closeSheet(); return; }
  const grade = parseGradeInput(document.getElementById('gradeInput').value);
  // por si quedó algo escrito sin pulsar +
  addItem('goodItemInput','goodList', goodItems);
  addItem('badItemInput','badList', badItems);

  if(grade === null && goodItems.length === 0 && badItems.length === 0){
    delete data[activeDate];
  }else{
    data[activeDate] = { grade, good: goodItems.slice(), bad: badItems.slice() };
  }
  await persist();
  render();
  closeSheet();
});

document.getElementById('deleteBtn').addEventListener('click', async ()=>{
  if(!activeDate) return;
  delete data[activeDate];
  await persist();
  render();
  closeSheet();
});

document.getElementById('prevYear').addEventListener('click', ()=>{
  currentYear--; loadYear(currentYear);
});
document.getElementById('nextYear').addEventListener('click', ()=>{
  currentYear++; loadYear(currentYear);
});

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if(metaTheme) metaTheme.setAttribute('content', theme === 'dark' ? '#0A0A0D' : '#12172B');
}

async function initTheme(){
  let theme = 'dark';
  try{
    const res = await storage.get('theme', false);
    if(res && res.value === 'light'){ theme = 'light'; }
  }catch(e){
    // sin preferencia guardada todavía, se queda en oscuro
  }
  applyTheme(theme);
}

document.getElementById('themeToggle').addEventListener('click', async ()=>{
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try{
    await storage.set('theme', next, false);
  }catch(e){
    console.error('No se pudo guardar el tema', e);
  }
});

initTheme();
loadYear(currentYear);
</script>
</body>
</html>
